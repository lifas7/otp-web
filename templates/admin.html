<!-- استبدل الجدول داخل admin.html بهذا -->
<table class="w-full text-right whitespace-nowrap">
  <thead class="bg-slate-800 text-slate-300">
    <tr>
      <th class="p-4">ID</th>
      <th class="p-4">الاسم</th>
      <th class="p-4">الإيميل (Google)</th>
      <th class="p-4">الحالة</th>
      <th class="p-4">محاولات اليوم</th>
      <th class="p-4">تاريخ التسجيل</th>
    </tr>
  </thead>
  <tbody class="divide-y divide-slate-800">
    {% for u in users %}
    <tr class="hover:bg-slate-800/50">
      <td class="p-4 font-mono text-slate-500">{{ u.id }}</td>
      <td class="p-4 font-bold text-white">{{ u.name or 'لم يكمل' }}</td>
      <td class="p-4 text-cyan-400 font-mono" dir="ltr">{{ u.email }}</td>
      <td class="p-4">
        {% if u.is_complete == 1 %}
          <span class="bg-green-900/30 text-green-400 px-2 py-1 rounded text-xs border border-green-800">مفعل</span>
        {% else %}
          <span class="bg-red-900/30 text-red-400 px-2 py-1 rounded text-xs border border-red-800">غير مكتمل</span>
        {% endif %}
      </td>
      <td class="p-4"><span class="bg-cyan-900/30 text-cyan-400 px-3 py-1 rounded-lg border border-cyan-800">{{ u.daily_count }}</span></td>
      <td class="p-4 text-sm text-slate-400">{{ u.created_at[:16].replace('T',' ') }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
